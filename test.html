<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Customizable Thorana (HTML + CSS + JS)</title>
	<style>
		:root { color-scheme: dark; }
		* { box-sizing: border-box; }
		body {
			margin: 0;
			font-family: Arial, sans-serif;
			background: #040609;
			color: #f5f7ff;
		}
		.layout {
			min-height: 100vh;
			display: grid;
			grid-template-columns: minmax(270px, 320px) 1fr;
		}
		.controls {
			padding: 16px;
			border-right: 1px solid rgba(255, 255, 255, 0.2);
			background: #0b1119;
		}
		.controls h1 {
			font-size: 1.1rem;
			margin: 0 0 14px;
		}
		.control {
			margin: 10px 0;
			display: grid;
			gap: 6px;
		}
		label { font-size: 0.9rem; }
		input[type="range"], input[type="color"] { width: 100%; }
		button {
			margin-top: 8px;
			width: 100%;
			padding: 10px;
			border: 0;
			border-radius: 8px;
			cursor: pointer;
			font-weight: 700;
			background: #ffd05a;
			color: #111;
		}
		.canvas-wrap {
			display: grid;
			place-items: center;
			padding: 12px;
		}
		canvas {
			width: min(1200px, 100%);
			height: auto;
			aspect-ratio: 2 / 1;
			background: #010307;
			border: 1px solid rgba(255, 255, 255, 0.18);
			border-radius: 12px;
		}
		@media (max-width: 900px) {
			.layout { grid-template-columns: 1fr; }
			.controls { border-right: 0; border-bottom: 1px solid rgba(255, 255, 255, 0.2); }
		}
	</style>
</head>
<body>
	<div class="layout">
		<aside class="controls">
			<h1>Customizable Thorana</h1>
			<div class="control">
				<label for="bg">Background</label>
				<input id="bg" type="color" value="#040609">
			</div>
			<div class="control">
				<label for="frame">Frame color</label>
				<input id="frame" type="color" value="#ffffff">
			</div>
			<div class="control">
				<label for="lampA">Lamp color A</label>
				<input id="lampA" type="color" value="#ffd54a">
			</div>
			<div class="control">
				<label for="lampB">Lamp color B</label>
				<input id="lampB" type="color" value="#44d4ff">
			</div>
			<div class="control">
				<label for="speed">Animation speed</label>
				<input id="speed" type="range" min="0" max="4" step="0.1" value="1.4">
			</div>
			<div class="control">
				<label for="density">Bulb density</label>
				<input id="density" type="range" min="8" max="52" step="1" value="24">
			</div>
			<div class="control">
				<label for="size">Bulb size</label>
				<input id="size" type="range" min="1" max="8" step="0.2" value="3.2">
			</div>
			<div class="control">
				<label for="glow">Glow</label>
				<input id="glow" type="range" min="0" max="28" step="1" value="12">
			</div>
			<div class="control">
				<label for="scale">Overall scale</label>
				<input id="scale" type="range" min="0.75" max="1.3" step="0.01" value="1">
			</div>
			<button id="reset" type="button">Reset</button>
		</aside>
		<div class="canvas-wrap">
			<canvas id="myCanvas">Your browser does not support canvas.</canvas>
		</div>
	</div>

	<script>
		const canvas = document.getElementById("myCanvas");
		const ctx = canvas.getContext("2d");

		const defaults = {
			bg: "#040609",
			frame: "#ffffff",
			lampA: "#ffd54a",
			lampB: "#44d4ff",
			speed: 1.4,
			density: 24,
			size: 3.2,
			glow: 12,
			scale: 1
		};

		const config = { ...defaults };
		const controls = {
			bg: document.getElementById("bg"),
			frame: document.getElementById("frame"),
			lampA: document.getElementById("lampA"),
			lampB: document.getElementById("lampB"),
			speed: document.getElementById("speed"),
			density: document.getElementById("density"),
			size: document.getElementById("size"),
			glow: document.getElementById("glow"),
			scale: document.getElementById("scale")
		};

		function hexToRgb(hex) {
			const clean = hex.replace("#", "");
			const n = parseInt(clean, 16);
			return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
		}

		function mixRgb(a, b, t) {
			const c1 = hexToRgb(a);
			const c2 = hexToRgb(b);
			const m = (x, y) => Math.round(x + (y - x) * t);
			return `rgb(${m(c1.r, c2.r)}, ${m(c1.g, c2.g)}, ${m(c1.b, c2.b)})`;
		}

		function setConfigFromInputs() {
			for (const key in controls) {
				const value = controls[key].value;
				config[key] = controls[key].type === "range" ? Number(value) : value;
			}
		}

		Object.values(controls).forEach((el) => el.addEventListener("input", setConfigFromInputs));
		document.getElementById("reset").addEventListener("click", () => {
			for (const key in defaults) controls[key].value = defaults[key];
			setConfigFromInputs();
		});

		function resizeCanvas() {
			const dpr = window.devicePixelRatio || 1;
			const cssWidth = canvas.clientWidth;
			const cssHeight = canvas.clientHeight;
			canvas.width = Math.floor(cssWidth * dpr);
			canvas.height = Math.floor(cssHeight * dpr);
			ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
		}

		function drawCircle(x, y, radius) {
			ctx.beginPath();
			ctx.arc(x, y, radius, 0, Math.PI * 2);
			ctx.fillStyle = "rgba(0,0,0,0.8)";
			ctx.strokeStyle = config.frame;
			ctx.lineWidth = 2;
			ctx.fill();
			ctx.stroke();
		}

		function drawMakara(cx, topY, width, height, direction) {
			const sign = direction === "left" ? -1 : 1;
			const startX = cx + sign * width * 0.5;
			ctx.beginPath();
			ctx.moveTo(cx, topY);
			ctx.bezierCurveTo(
				startX + sign * width * 0.15, topY + height * 0.2,
				startX + sign * width * 0.25, topY + height * 0.7,
				startX, topY + height
			);
			ctx.lineTo(cx, topY + height * 0.88);
			ctx.closePath();
			ctx.fillStyle = "rgba(0,0,0,0.85)";
			ctx.strokeStyle = config.frame;
			ctx.lineWidth = 2;
			ctx.fill();
			ctx.stroke();
		}

		function drawBulb(x, y, color, size) {
			ctx.shadowBlur = config.glow;
			ctx.shadowColor = color;
			ctx.beginPath();
			ctx.arc(x, y, size, 0, Math.PI * 2);
			ctx.fillStyle = color;
			ctx.fill();
		}

		function ringLights(cx, cy, radius, count, t, phaseShift, size) {
			for (let i = 0; i < count; i++) {
				const a = (Math.PI * 2 * i) / count;
				const px = cx + radius * Math.cos(a);
				const py = cy + radius * Math.sin(a);
				const phase = (Math.sin(t * config.speed + a * 2 + phaseShift) + 1) / 2;
				drawBulb(px, py, mixRgb(config.lampA, config.lampB, phase), size);
			}
		}

		function drawPanelLights(x, y, w, h, t) {
			const cols = 18;
			const rows = 6;
			const gapX = w / (cols + 1);
			const gapY = h / (rows + 1);
			for (let r = 1; r <= rows; r++) {
				for (let c = 1; c <= cols; c++) {
					const px = x + gapX * c;
					const py = y + gapY * r;
					const wave = (Math.sin((c + r) * 0.45 + t * config.speed * 1.8) + 1) / 2;
					drawBulb(px, py, mixRgb(config.lampA, config.lampB, wave), Math.max(1, config.size * 0.65));
				}
			}
		}

		function render(timeMs) {
			const t = timeMs * 0.001;
			const width = canvas.clientWidth;
			const height = canvas.clientHeight;
			const cx = width / 2;
			const cy = height * 0.38;
			const R = Math.min(width, height) * 0.13 * config.scale;
			const r = R * 0.48;
			const orbit = R + r;

			ctx.clearRect(0, 0, width, height);
			ctx.shadowBlur = 0;
			ctx.fillStyle = config.bg;
			ctx.fillRect(0, 0, width, height);

			const panelX = cx - orbit - 2.2 * r;
			const panelY = cy + orbit * 0.72;
			const panelW = (orbit + 2.2 * r) * 2;
			const panelH = height * 0.34;

			ctx.fillStyle = "rgba(0,0,0,0.75)";
			ctx.strokeStyle = config.frame;
			ctx.lineWidth = 2;
			ctx.fillRect(panelX, panelY, panelW, panelH);
			ctx.strokeRect(panelX, panelY, panelW, panelH);

			drawMakara(panelX, panelY, panelH * 0.75, panelH, "left");
			drawMakara(panelX + panelW, panelY, panelH * 0.75, panelH, "right");

			drawCircle(cx, cy, R);
			for (let i = 0; i < 8; i++) {
				const a = (Math.PI * 2 * i) / 8 + Math.PI / 2;
				drawCircle(cx + orbit * Math.cos(a), cy + orbit * Math.sin(a), r);
			}

			const count = Math.max(8, Math.floor(config.density));
			ringLights(cx, cy, R * 0.86, count + 12, t, 0.3, config.size);
			ringLights(cx, cy, R * 0.58, count, t, 1.1, Math.max(1, config.size * 0.85));
			for (let i = 0; i < 8; i++) {
				const a = (Math.PI * 2 * i) / 8 + Math.PI / 2;
				const sx = cx + orbit * Math.cos(a);
				const sy = cy + orbit * Math.sin(a);
				ringLights(sx, sy, r * 0.82, Math.max(8, count - 4), t, i * 0.9, Math.max(1, config.size * 0.75));
			}

			drawPanelLights(panelX, panelY, panelW, panelH, t);
			ctx.shadowBlur = 0;
			requestAnimationFrame(render);
		}

		setConfigFromInputs();
		window.addEventListener("resize", resizeCanvas);
		resizeCanvas();
		requestAnimationFrame(render);
	</script>
</body>
</html>
